services:
  mysql:
    image: mysql:8.4
    container_name: santis-coffee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: santis_coffee
      MYSQL_USER: cafeteria
      MYSQL_PASSWORD: cafeteria
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: santis-coffee-backend
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cafeteria
      DB_PASSWORD: cafeteria
      DB_NAME: santis_coffee
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:1b
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: santis-coffee-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
